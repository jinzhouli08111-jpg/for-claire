<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, Microsoft YaHei" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FAF7F1"/>

  <g id="header" data-pptx-bounds="96 72 1084 108">
    <text x="96" y="104" font-family="Arial, Microsoft YaHei" font-size="14" letter-spacing="5" fill="#A98A57">肆 · CONTRASTS</text>
    <text x="96" y="158" font-family="Georgia, SimSun" font-size="46" fill="#1E3527">四个容易混淆的邻居</text>
  </g>

  <rect id="header-rule" data-pptx-role="decoration" x="96" y="196" width="1084" height="1" fill="#D9D2C5"/>

  <g id="card-static" data-pptx-bounds="96 226 258 300">
    <rect x="96" y="226" width="258" height="300" fill="#FFFFFF" stroke="#E3DCCF" stroke-width="1"/>
    <text x="126" y="282" font-family="Georgia, SimSun" font-size="24" fill="#1E3527">静奢风</text>
    <text x="126" y="312" font-family="Arial, Microsoft YaHei" font-size="12" letter-spacing="2" fill="#A98A57">QUIET LUXURY</text>
    <rect x="126" y="334" width="40" height="1" fill="#A98A57"/>
    <text x="126" y="376" font-family="Arial, Microsoft YaHei" font-size="15" fill="#7A7268">老钱风的现代版本。</text>
    <text x="126" y="402" font-family="Arial, Microsoft YaHei" font-size="15" fill="#7A7268">同样拒绝logo，</text>
    <text x="126" y="428" font-family="Arial, Microsoft YaHei" font-size="15" fill="#7A7268">但更主动地标榜</text>
    <text x="126" y="454" font-family="Arial, Microsoft YaHei" font-size="15" fill="#7A7268">“我很贵但不张扬”。</text>
    <text x="126" y="500" font-family="Georgia, SimSun" font-size="13" font-style="italic" fill="#A39A8C">关键差别：静奢是买来的，</text>
    <text x="126" y="520" font-family="Georgia, SimSun" font-size="13" font-style="italic" fill="#A39A8C">老钱是习得的。</text>
  </g>

  <g id="card-prep" data-pptx-bounds="378 226 258 300">
    <rect x="378" y="226" width="258" height="300" fill="#FFFFFF" stroke="#E3DCCF" stroke-width="1"/>
    <text x="408" y="282" font-family="Georgia, SimSun" font-size="24" fill="#1E3527">预科生风</text>
    <text x="408" y="312" font-family="Arial, Microsoft YaHei" font-size="12" letter-spacing="2" fill="#A98A57">PREPPY</text>
    <rect x="408" y="334" width="40" height="1" fill="#A98A57"/>
    <text x="408" y="376" font-family="Arial, Microsoft YaHei" font-size="15" fill="#7A7268">老钱风的校园分支。</text>
    <text x="408" y="402" font-family="Arial, Microsoft YaHei" font-size="15" fill="#7A7268">V领毛衣、polo衫、</text>
    <text x="408" y="428" font-family="Arial, Microsoft YaHei" font-size="15" fill="#7A7268">乐福鞋，色彩更深，</text>
    <text x="408" y="454" font-family="Arial, Microsoft YaHei" font-size="15" fill="#7A7268">带明确的学院派符号。</text>
    <text x="408" y="500" font-family="Georgia, SimSun" font-size="13" font-style="italic" fill="#A39A8C">关键差别：预科生风</text>
    <text x="408" y="520" font-family="Georgia, SimSun" font-size="13" font-style="italic" fill="#A39A8C">乐于展示出身。</text>
  </g>

  <g id="card-new" data-pptx-bounds="660 226 258 300">
    <rect x="660" y="226" width="258" height="300" fill="#FFFFFF" stroke="#E3DCCF" stroke-width="1"/>
    <text x="690" y="282" font-family="Georgia, SimSun" font-size="24" fill="#1E3527">新钱风</text>
    <text x="690" y="312" font-family="Arial, Microsoft YaHei" font-size="12" letter-spacing="2" fill="#A98A57">NEW MONEY</text>
    <rect x="690" y="334" width="40" height="1" fill="#A98A57"/>
    <text x="690" y="376" font-family="Arial, Microsoft YaHei" font-size="15" fill="#7A7268">老钱风的镜像对手。</text>
    <text x="690" y="402" font-family="Arial, Microsoft YaHei" font-size="15" fill="#7A7268">高饱和、大logo、</text>
    <text x="690" y="428" font-family="Arial, Microsoft YaHei" font-size="15" fill="#7A7268">夸张剪裁，强调</text>
    <text x="690" y="454" font-family="Arial, Microsoft YaHei" font-size="15" fill="#7A7268">“我买得起”。</text>
    <text x="690" y="500" font-family="Georgia, SimSun" font-size="13" font-style="italic" fill="#A39A8C">关键差别：一个是</text>
    <text x="690" y="520" font-family="Georgia, SimSun" font-size="13" font-style="italic" fill="#A39A8C">证明，一个是无需。</text>
  </g>

  <g id="card-norm" data-pptx-bounds="942 226 238 300">
    <rect x="942" y="226" width="238" height="300" fill="#FFFFFF" stroke="#E3DCCF" stroke-width="1"/>
    <text x="972" y="282" font-family="Georgia, SimSun" font-size="24" fill="#1E3527">极简风</text>
    <text x="972" y="312" font-family="Arial, Microsoft YaHei" font-size="12" letter-spacing="2" fill="#A98A57">NORMCORE</text>
    <rect x="972" y="334" width="40" height="1" fill="#A98A57"/>
    <text x="972" y="376" font-family="Arial, Microsoft YaHei" font-size="15" fill="#7A7268">老钱风的反面参照。</text>
    <text x="972" y="402" font-family="Arial, Microsoft YaHei" font-size="15" fill="#7A7268">刻意普通、灰调、</text>
    <text x="972" y="428" font-family="Arial, Microsoft YaHei" font-size="15" fill="#7A7268">无品牌识别，追求</text>
    <text x="972" y="454" font-family="Arial, Microsoft YaHei" font-size="15" fill="#7A7268">“看起来毫不用力”。</text>
    <text x="972" y="500" font-family="Georgia, SimSun" font-size="13" font-style="italic" fill="#A39A8C">关键差别：极简是</text>
    <text x="972" y="520" font-family="Georgia, SimSun" font-size="13" font-style="italic" fill="#A39A8C">选择，老钱是底色。</text>
  </g>

  <g id="footer" data-pptx-bounds="96 648 1084 36">
    <text x="96" y="676" font-family="Arial, Microsoft YaHei" font-size="13" fill="#A39A8C">老钱风 · 风格解析</text>
    <text x="1180" y="676" text-anchor="end" font-family="Georgia, SimSun" font-size="13" fill="#A39A8C">06</text>
  </g>
</svg>
