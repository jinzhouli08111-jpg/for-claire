<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B3A5C">
<title>学术海报 · 排版润色</title>
<link rel="stylesheet" href="poster.css">
<link rel="stylesheet" href="palette.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot" aria-hidden="true"></span>
    <strong>学术海报排版润色</strong>
    <span class="muted">内容冻结 · 仅改版式</span>
  </div>

  <nav class="tabs" role="tablist" aria-label="输出格式">
    <button class="tab is-active" data-format="ppt" role="tab" aria-selected="true">PPT</button>
    <button class="tab" data-format="pdf" role="tab" aria-selected="false">PDF</button>
    <button class="tab" data-format="word" role="tab" aria-selected="false">Word</button>
  </nav>

  <div class="actions">
    <span id="status" role="status" aria-live="polite"></span>
    <button id="btn-export" class="btn btn--primary">导出当前格式</button>
  </div>
</header>

<main class="stage-wrap">
  <div id="stage" aria-live="polite"></div>
</main>

<!-- ============ 调色盘 ============ -->
<button id="palette-fab" class="palette-fab" aria-expanded="false" aria-controls="palette-panel" title="配色">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 3a9 9 0 1 0 0 18h1.5a2 2 0 0 0 0-4H13a2 2 0 0 1 0-4h4a4 4 0 0 0 4-4c0-3.3-4-6-9-6Z"/>
    <circle cx="7.5" cy="10.5" r="1.1" fill="currentColor" stroke="none"/>
    <circle cx="12" cy="7.5" r="1.1" fill="currentColor" stroke="none"/>
    <circle cx="16.5" cy="9" r="1.1" fill="currentColor" stroke="none"/>
  </svg>
</button>

<div id="palette-panel" class="palette-panel" role="dialog" aria-label="配色设置" data-locked="true">

  <div class="panel__head">
    <span class="panel__title">配色</span>
    <button class="panel__close" id="js-close" aria-label="关闭配色面板">×</button>
  </div>

  <div class="panel__section">
    <div class="mode-row">
      <label class="mode">
        <input class="js-mode" type="radio" name="palmode" value="original" checked>
        <span>保留原文件</span>
      </label>
      <label class="mode">
        <input class="js-mode" type="radio" name="palmode" value="custom">
        <span>自定义</span>
      </label>
    </div>
    <div class="locknote" id="js-locknote">
      <span aria-hidden="true">🔒</span>
      <span>已锁定原文件配色，不引入任何新颜色</span>
    </div>
  </div>

  <div class="panel__section">
    <span class="panel__label">预置主题</span>
    <div class="presets" id="js-presets"></div>
  </div>

  <div class="panel__section">
    <span class="panel__label">自定义色相</span>
    <div class="custom-row">
      <input class="color-input" id="js-color" type="color" value="#1B3A5C" aria-label="选择颜色">
      <input class="hex-input" id="js-hex" type="text" maxlength="6" spellcheck="false" aria-label="十六进制颜色值">
      <span id="js-current" class="swatch-current" aria-hidden="true"></span>
    </div>
    <div class="file-row">
      <label class="file-btn">
        <span aria-hidden="true">🖼</span> 上传图片取色
        <input id="js-file" type="file" accept="image/*">
      </label>
      <span class="file-note" id="js-extract-note"></span>
    </div>
  </div>

  <div class="panel__section">
    <div class="switch-row">
      <span>强调色</span>
      <label class="switch">
        <input id="js-accent" type="checkbox" checked>
        <i></i>
      </label>
    </div>
  </div>

  <div class="panel__foot">
    <button class="reset-btn" id="js-reset">恢复原文件配色</button>
  </div>

</div>

<script src="config.js"></script>
<script src="theme.js"></script>
<script src="render.js"></script>
<script src="palette.js"></script>
<script src="export.js"></script>
<script src="app.js"></script>
</body>
</html>
