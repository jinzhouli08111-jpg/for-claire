<title>草稿详情 · Claire Essay</title>
<style>
  :root {
    --bg: #f5f9f6;
    --panel: #ffffff;
    --ink: #1f2a23;
    --muted: #6b7a70;
    --line: #e3ebe5;
    --brand: #16a34a;
    --brand-dark: #15803d;
    --brand-soft: #e9f7ee;
    --warn: #d97706;
    --quote-bg: #edf7f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); line-height: 1.7;
    font-family: var(--font);
  }
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: var(--s-100);
    height: 64px; padding: 0 var(--s-300);
    background: rgba(255, 255, 255, .82);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .back {
    color: var(--brand-dark); text-decoration: none;
    font-size: 14px; line-height: 20px; font-weight: 600;
    padding: var(--s-75) var(--s-100); border-radius: var(--r-lg);
    border: 1px solid var(--line); background: #fff; white-space: nowrap;
    transition: border-color var(--dur) var(--ease), background-color var(--dur) var(--ease);
  }
  .back:hover { border-color: var(--brand); background: var(--brand-soft); }
  .brand { margin-left: auto; font-family: Georgia, serif; font-style: italic; font-weight: 700; color: var(--brand); opacity: .75; }
  .wrap { max-width: 1080px; margin: var(--s-400) auto var(--s-700); padding: 0 var(--s-300); }

  .doc-head { margin-bottom: 16px; }
  .doc-head h1 { font-size: 20px; margin: 0 0 4px; line-height: 1.4; }
  .doc-meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .doc-meta b { font-weight: 600; color: var(--ink); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  .pane {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-2xl);
    padding: var(--s-300); box-shadow: var(--shadow-1); min-width: 0;
  }
  .pane h2 {
    font-size: 16px; line-height: 24px; font-weight: 600;
    margin: 0 0 var(--s-100); display: flex; align-items: center; gap: var(--s-75); color: var(--ink-2);
  }
  .pane h2::before { content: ''; width: 3px; height: 13px; border-radius: 2px; background: var(--brand); }
  .pane h2 .count { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 12px; }
  .text {
    white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.95;
    max-height: 44vh; overflow-y: auto; padding-right: 4px;
  }
  .text.muted { color: #4b5563; }

  .tabs { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
  .tab {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    border-radius: 8px; padding: 4px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .tab.on { background: var(--brand-soft); border-color: #bfe6cd; color: var(--brand-dark); font-weight: 600; }
  .tab .wc { font-size: 12px; opacity: .75; margin-left: 4px; }

  .pair {
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px; margin-bottom: 8px;
    background: #fcfdfc;
  }
  .pair-line { display: flex; gap: 8px; font-size: 14px; line-height: 1.8; }
  .pair-line + .pair-line { margin-top: 4px; }
  .tag {
    flex: none; font-size: 12px; padding: 0px 8px; border-radius: 4px; height: 19px;
    line-height: 17px; margin-top: 2px; font-weight: 600;
  }
  .tag-old { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .tag-new { background: #eefaf2; color: var(--brand-dark); border: 1px solid #bfe6cd; }
  .pair-main { flex: 1; min-width: 0; }
  .pair-note { font-size: 12px; color: var(--muted); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }

  .md { font-size: 14px; line-height: 1.85; max-height: 60vh; overflow-y: auto; }
  .md h1,.md h2,.md h3,.md h4 { margin: 1em 0 .45em; line-height: 1.4; }
  .md h1 { font-size: 1.25em; } .md h2 { font-size: 1.15em; } .md h3 { font-size: 1.02em; }
  .md p { margin: .5em 0; }
  .md ul,.md ol { margin: .4em 0 .4em 1.3em; padding: 0; }
  .md blockquote {
    margin: .6em 0; padding: 8px 12px; border-left: 3px solid var(--brand);
    background: var(--quote-bg); border-radius: 0 8px 8px 0; color: #374151;
  }
  .md blockquote p { margin: .2em 0; }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 1em 0; }
  .md code { background: #eef1f6; padding: 0px 4px; border-radius: 4px; font-size: .92em; }

  .empty { color: #9ca3af; font-size: 14px; padding: 24px 4px; text-align: center; }

  /* —— 草稿列表 —— */
  .list-row {
    display: flex; align-items: center; gap: 12px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px;
    cursor: pointer; transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  .list-row:hover { border-color: var(--brand); transform: translateY(-1px); }
  .list-main { flex: 1; min-width: 0; }
  .list-title { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .list-del {
    flex: none; border: 1px solid var(--line); background: #fff; color: var(--muted);
    border-radius: 8px; width: 28px; height: 28px; cursor: pointer; font-size: 16px; line-height: 1;
  }
  .list-del:hover { color: #fff; background: #dc2626; border-color: #dc2626; }
  .list-tools { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .danger-btn {
    border: 1px solid #f0d6d6; background: #fff; color: #b91c1c; cursor: pointer;
    font-size: 12px; padding: 4px 12px; border-radius: 8px; font-family: inherit;
  }
  .danger-btn:hover { background: #fef2f2; border-color: #f5b5b5; }
  .foot { text-align: center; font-size: 12px; color: #9ca3af; margin-top: 24px; line-height: 1.7; }

  /* __responsive__ */
  @media (max-width: 640px) {
    .topbar { padding: 0 var(--s-200); }
    .wrap { padding: 0 var(--s-200); }
  }
</style>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
<div class="topbar">
  <a class="back" href="./home.html">← 返回首页</a>
  <span class="brand">For Claire</span>
</div>
<div class="wrap" id="app" role="main"></div>

<script>
var DRAFT_KEY = 'claire_drafts_v1';
var MAX_SHOW = 200;

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return s;
}

function renderMarkdown(text) {
  var lines = String(text || '').split('\n');
  var html = [], i, line, m, listType = '', quoteOpen = false;
  function closeList() { if (listType) { html.push('</' + listType + '>'); listType = ''; } }
  function closeQuote() { if (quoteOpen) { html.push('</blockquote>'); quoteOpen = false; } }

  for (i = 0; i < lines.length; i++) {
    line = lines[i];
    if (/^\s*$/.test(line)) { closeList(); closeQuote(); continue; }

    m = line.match(/^(#{1,6})\s+(.*)$/);
    if (m) { closeList(); closeQuote(); html.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); continue; }

    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { closeList(); closeQuote(); html.push('<hr/>'); continue; }

    m = line.match(/^\s*>\s?(.*)$/);
    if (m) { closeList(); if (!quoteOpen) { quoteOpen = true; html.push('<blockquote>'); } html.push('<p>' + inline(m[1]) + '</p>'); continue; }

    m = line.match(/^\s*[-*+]\s+(.*)$/);
    if (m) { closeQuote(); if (listType !== 'ul') { closeList(); listType = 'ul'; html.push('<ul>'); } html.push('<li>' + inline(m[1]) + '</li>'); continue; }

    m = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (m) { closeQuote(); if (listType !== 'ol') { closeList(); listType = 'ol'; html.push('<ol>'); } html.push('<li>' + inline(m[1]) + '</li>'); continue; }

    closeList(); closeQuote();
    html.push('<p>' + inline(line) + '</p>');
  }
  closeList(); closeQuote();
  return html.join('\n');
}

function countWords(t) {
  var s = String(t || ''), n = 0, m;
  m = s.match(/[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/g); if (m) n += m.length;
  m = s.match(/[A-Za-z]+(?:['’\-][A-Za-z]+)*/g); if (m) n += m.length;
  m = s.match(/\d+(?:[.,]\d+)*/g); if (m) n += m.length;
  return n;
}

function fmtTime(ts) {
  var d = new Date(ts);
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function fmtDay(ts) {
  var d = new Date(ts);
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

// —— 存储 ——
function loadDrafts() {
  try {
    var raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return [];
    var arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

function saveDrafts(list) {
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(list)); return true; }
  catch (e) { return false; }
}

// —— 解析 ——
function parseVersions(text) {
  var out = [], re = /【本版字数[：:]\s*(\d+)\s*】/g, last = 0, m;
  text = String(text || '');
  while ((m = re.exec(text)) !== null) {
    var chunk = text.slice(last, m.index);
    var lines = chunk.split('\n');
    var lastHead = -1, i;
    for (i = 0; i < lines.length; i++) if (/^\s*#{1,6}\s+\S/.test(lines[i])) lastHead = i;
    var title = lastHead >= 0 ? lines[lastHead].replace(/^\s*#{1,6}\s+/, '').trim() : ('第 ' + (out.length + 1) + ' 版');
    var body = (lastHead >= 0 ? lines.slice(lastHead + 1) : lines).join('\n').trim();
    out.push({ title: title, text: body, count: countWords(body) });
    last = m.index + m[0].length;
  }
  return out;
}

function parsePairs(md) {
  var out = [], cur = null, lines = String(md || '').split('\n');
  for (var i = 0; i < lines.length; i++) {
    if (!/^\s*>/.test(lines[i])) {
      if (cur && (cur.orig || cur.neu)) { out.push(cur); cur = null; }
      continue;
    }
    var t = lines[i].replace(/^\s*>\s?/, '').replace(/^\*+/, '').replace(/\*+$/, '').trim();
    if (!t) continue;
    var m;
    if ((m = t.match(/^原句[：:]\s*(.*)$/))) {
      if (cur && (cur.orig || cur.neu)) out.push(cur);
      cur = { orig: m[1].trim(), neu: '', note: '' };
    } else if ((m = t.match(/^改句[：:]\s*(.*)$/))) {
      if (!cur) cur = { orig: '', neu: '', note: '' };
      cur.neu = m[1].trim();
    } else if ((m = t.match(/^说明[：:]\s*(.*)$/))) {
      if (!cur) cur = { orig: '', neu: '', note: '' };
      cur.note = m[1].trim();
      out.push(cur); cur = null;
    }
  }
  if (cur && (cur.orig || cur.neu)) out.push(cur);
  return out;
}

// 把三份版本那一段从点评里切掉，避免右侧重复
function reportOnly(md) {
  var m = String(md || '').match(/^#{1,6}\s*(?:[ABCABC一二三][ 　]*版|版本[ 　]*[ABC一二三]).*$/m);
  if (m && m.index > 200) return md.slice(0, m.index);
  var q = String(md || '').indexOf('【第六步');
  if (q > 200) return md.slice(0, q);
  return md;
}

// —— 视图 ——
function renderList() {
  var list = loadDrafts();
  var html = '<div class="doc-head"><h1>草稿箱</h1>'
    + '<div class="doc-meta">共 ' + list.length + ' 篇 · 只存在这台设备的浏览器里</div></div>';

  if (list.length) {
    html += '<div class="list-tools"><button class="danger-btn" id="clearAll">清除全部草稿</button></div>';
  }

  if (!list.length) {
    html += '<div class="pane"><div class="empty">还没有草稿。回打磨页跑一次，就会自动存进来。</div></div>';
  } else {
    for (var i = 0; i < list.length; i++) {
      var d = list[i];
      var sub = fmtTime(d.time) + ' · 原文 ' + (d.words || countWords(d.essay || '')) + ' 字';
      if (d.target) sub += ' · 目标 ' + d.target;
      if (d.counts && d.counts.length) {
        sub += ' · 成稿 ' + d.counts.map(function (c) { return c.count; }).join('/') + ' 字';
      }
      html += '<div class="list-row" data-id="' + esc(d.id) + '">' +
        '<div class="list-main"><div class="list-title">' + esc(d.title || '未命名') + '</div>' +
        '<div class="list-sub">' + esc(sub) + '</div></div>' +
        '<button class="list-del" data-del="' + esc(d.id) + '" title="删除">×</button>' +
      '</div>';
    }
  }
  html += '<div class="foot">草稿保存在浏览器本地（localStorage），不会上传。<br/>换设备或清浏览器数据就没了。</div>';
  document.getElementById('app').innerHTML = html;
}

function renderDetail(d) {
  document.title = (d.title || '草稿') + ' · Claire Essay';
  var versions = parseVersions(d.result || '');
  var pairs = parsePairs(d.result || '');
  var report = reportOnly(d.result || '');
  var words = d.words || countWords(d.essay || '');

  var meta = [];
  meta.push('保存于 <b>' + esc(fmtTime(d.time)) + '</b>');
  meta.push('原文 <b>' + words + '</b> 字');
  if (d.target) {
    meta.push('目标 <b>' + d.target + '</b> 字');
    meta.push('策略 <b>' + (d.strategy === 'cut' ? '删改整合' : '保句精简') + '</b>');
  }
  if (d.counts && d.counts.length) {
    meta.push('成稿 ' + d.counts.map(function (c) { return c.count + ' 字'; }).join(' / '));
  }
  if (d.topic) meta.push('题目 <b>' + esc(d.topic) + '</b>');

  var tabs = '', firstBody = '';
  if (versions.length) {
    for (var i = 0; i < versions.length; i++) {
      tabs += '<button class="tab' + (i === 0 ? ' on' : '') + '" data-v="' + i + '">' +
        esc(versions[i].title || ('第 ' + (i + 1) + ' 版')) +
        '<span class="wc">' + versions[i].count + ' 字</span></button>';
    }
    firstBody = versions[0].text;
  }

  var pairsHtml = '';
  if (pairs.length) {
    for (var p = 0; p < pairs.length; p++) {
      var it = pairs[p];
      pairsHtml += '<div class="pair">' +
        (it.orig ? '<div class="pair-line"><span class="tag tag-old">原句</span><span class="pair-main">' + esc(it.orig) + '</span></div>' : '') +
        (it.neu ? '<div class="pair-line"><span class="tag tag-new">改句</span><span class="pair-main">' + esc(it.neu) + '</span></div>' : '') +
        (it.note ? '<div class="pair-note">' + esc(it.note) + '</div>' : '') +
      '</div>';
    }
  } else {
    pairsHtml = '<div class="empty">这篇结果里没有解析到「原句 / 改句」结构。</div>';
  }

  var html = '' +
    '<div class="doc-head"><h1>' + esc(d.title || '未命名') + '</h1><div class="doc-meta">' + meta.join('') + '</div></div>' +
    '<div class="grid">' +
      '<div class="col">' +
        '<section class="pane"><h2>原文</h2><div class="text muted">' + esc(d.essay || '（没有存到原文）') + '</div></section>' +
        '<section class="pane"><h2>修改后<span class="count">' + (versions.length ? versions.length + ' 个版本' : '') + '</span></h2>' +
          (versions.length
            ? '<div class="tabs">' + tabs + '</div><div class="text" id="revBody">' + esc(firstBody) + '</div>'
            : '<div class="empty">这篇结果里没找到版本标记（【本版字数：N】），可能当时没勾「三份 A 级版本」。</div>') +
        '</section>' +
      '</div>' +
      '<div class="col">' +
        '<section class="pane"><h2>改动清单<span class="count">' + (pairs.length ? pairs.length + ' 处' : '') + '</span></h2>' + pairsHtml + '</section>' +
        '<section class="pane"><h2>完整点评</h2><div class="md">' + renderMarkdown(report) + '</div></section>' +
      '</div>' +
    '</div>';

  var app = document.getElementById('app');
  app.innerHTML = html;

  if (versions.length) {
    var btns = app.querySelectorAll('.tab');
    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function () {
        for (var k = 0; k < btns.length; k++) btns[k].classList.remove('on');
        this.classList.add('on');
        var idx = parseInt(this.getAttribute('data-v'), 10);
        document.getElementById('revBody').textContent = versions[idx].text;
      });
    }
  }
}

function renderMissing() {
  document.getElementById('app').innerHTML =
    '<div class="pane"><div class="empty">找不到这篇草稿。<br/>草稿只存在保存它的那台设备的浏览器里。<br/><br/>' +
    '<a href="./essay" style="color:#15803d">← 回打磨页</a></div></div>';
}

// —— 启动 ——
(function () {
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  if (!id) { renderList(); return; }

  var list = loadDrafts();
  var found = null;
  for (var i = 0; i < list.length; i++) if (list[i].id === id) { found = list[i]; break; }
  if (found) renderDetail(found); else renderMissing();
})();

// 列表页的点击与删除
document.addEventListener('click', function (e) {
  // 清除全部
  if (e.target && e.target.id === 'clearAll') {
    e.stopPropagation();
    var all = loadDrafts();
    if (!all.length) return;
    if (!window.confirm('确定清除全部 ' + all.length + ' 篇草稿吗？此操作不可恢复。')) return;
    saveDrafts([]);
    renderList();
    return;
  }
  var del = e.target.closest ? e.target.closest('[data-del]') : null;
  if (del) {
    e.stopPropagation();
    var did = del.getAttribute('data-del');
    var list = loadDrafts().filter(function (d) { return d.id !== did; });
    saveDrafts(list);
    renderList();
    return;
  }
  var row = e.target.closest ? e.target.closest('.list-row') : null;
  if (row) {
    location.href = './draft.html?id=' + encodeURIComponent(row.getAttribute('data-id'));
  }
});
</script>
</body>
</html>
